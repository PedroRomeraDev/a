<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MTV Minecraft</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <video id="video" autoplay muted controls></video>
    <script>
      var video = document.getElementById('video');
      var videoSrc = 'https://transmitted-shuttle-charging-ant.trycloudflare.com/live/mtv/index.m3u8';
      if (Hls.isSupported()) {
        var hls = new Hls();
        hls.loadSource(videoSrc);
        hls.attachTo(video);
      }
    </script>
</body>
</html>
